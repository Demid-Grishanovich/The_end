server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${SPRING_DATASOURCE_USERNAME:payments_user}
    password: ${SPRING_DATASOURCE_PASSWORD:payments_pass}
  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}

  security:
    internal-token: ${INTERNAL_TOKEN:}

  core:
    internal-base-url: ${CORE_INTERNAL_BASE_URL:http://localhost:8082}

  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  payments:
    default-amount-cents: ${PAYMENTS_AMOUNT_CENTS:500}
    default-task-quota: ${PAYMENTS_TASK_QUOTA:100}
    success-url: ${PAYMENTS_SUCCESS_URL:http://localhost:8080/api/payments/checkout/success}
    cancel-url: ${PAYMENTS_CANCEL_URL:http://localhost:8080/api/payments/checkout/cancel}
