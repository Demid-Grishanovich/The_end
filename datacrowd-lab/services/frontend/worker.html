<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DataCrowd Lab – Worker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="worker.html" class="nav-logo">🏷 DataCrowd Lab</a>
  <div class="nav-r">
    <span class="chip">Worker</span>
    <span class="nav-name" id="uname"></span>
    <a href="stats.html" class="btn btn-o btn-sm">My Stats</a>
    <button class="btn btn-g btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="wrap">
  <div class="ph">
    <div>
      <div class="ptitle">Worker Dashboard</div>
      <div class="psub">Choose a project and start earning points</div>
    </div>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:4px;margin-bottom:24px;background:var(--bg);border-radius:var(--r);padding:4px;width:fit-content">
    <button id="tabDo" class="btn btn-p btn-sm" onclick="switchTab('do')" style="min-width:140px">Do Tasks</button>
    <button id="tabReview" class="btn btn-g btn-sm" onclick="switchTab('review')" style="min-width:140px">Review Answers</button>
  </div>

  <div id="msgBox" class="hide"></div>

  <!-- ═══ DO TASKS ═══ -->
  <div id="tabDoSec">
    <div id="projectsGrid" class="grid3">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--tm)">
        <span class="spin spin-d"></span><p style="margin-top:10px">Loading projects...</p>
      </div>
    </div>
  </div>

  <!-- ═══ REVIEW ═══ -->
  <div id="tabReviewSec" class="hide">
    <div class="card tc" style="padding:48px 32px;max-width:500px;margin:0 auto">
      <div style="font-size:48px;margin-bottom:16px">🔍</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px">Review Answers</div>
      <div style="font-size:14px;color:var(--ts);margin-bottom:24px;line-height:1.6">
        Click the button below and the system will automatically<br>
        find the next answer waiting for your review
      </div>
      <button id="goReviewBtn" class="btn btn-p" style="min-width:220px;font-size:15px;justify-content:center" onclick="goToReview()">
        Find Answer to Review →
      </button>
      <div style="margin-top:16px;font-size:12px;color:var(--tm)">
        The system selects from all projects with pending answers
      </div>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080/api';
  const tok = localStorage.token;
  if (!tok) location.href = 'index.html';
  document.getElementById('uname').textContent = localStorage.uname || '';

  function logout() { localStorage.clear(); location.href = 'index.html'; }
  const H = () => ({ 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' });
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const show = id => document.getElementById(id).classList.remove('hide');
  const hide = id => document.getElementById(id).classList.add('hide');

  function switchTab(tab) {
    if (tab === 'do') {
      show('tabDoSec'); hide('tabReviewSec');
      document.getElementById('tabDo').className   = 'btn btn-p btn-sm';
      document.getElementById('tabReview').className = 'btn btn-g btn-sm';
    } else {
      hide('tabDoSec'); show('tabReviewSec');
      document.getElementById('tabDo').className   = 'btn btn-g btn-sm';
      document.getElementById('tabReview').className = 'btn btn-p btn-sm';
    }
  }

  // ─── DO TASKS ────────────────────────────────────────────────────────────
  async function loadProjects() {
    const grid = document.getElementById('projectsGrid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--tm)"><span class="spin spin-d"></span><p style="margin-top:10px">Loading...</p></div>';
    try {
      // Правильный эндпоинт для worker-а: /core/projects/available
      const r = await fetch(`${API}/core/projects/available`, { headers: H() });
      if (r.status === 401) { logout(); return; }
      if (!r.ok) throw new Error(`Status ${r.status}`);

      const data = await r.json();
      const projects = Array.isArray(data) ? data : (data.content || []);

      if (!projects.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--tm)">No active projects available right now. Check back later!</div>';
        return;
      }

      grid.innerHTML = projects.map(p => `
      <div class="pcard" onclick="startProject('${p.id}', '${esc(p.name)}', '${p.dataType||'TEXT'}')">
        <div class="pcard-hd">
          <div class="pcard-name">${esc(p.name)}</div>
          <span class="badge b-active">Active</span>
        </div>
        <div class="pcard-sub">${esc(p.dataType||'TEXT')} · ${p.reviewersCount||1} reviewer(s)</div>
        <div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap">
          <span style="font-size:12px;background:var(--pl);color:var(--p);padding:3px 8px;border-radius:100px">
            ${p.rewardPoints||0} pts/task
          </span>
          ${p.availableTasks !== undefined && p.availableTasks !== null
              ? `<span style="font-size:12px;background:var(--bg);color:var(--ts);padding:3px 8px;border-radius:100px">${p.availableTasks} available</span>`
              : ''}
        </div>
        ${p.description ? `<div style="font-size:12px;color:var(--ts);margin-bottom:10px">${esc(p.description)}</div>` : ''}
        <button class="btn btn-p btn-sm" style="width:100%;justify-content:center">Start Working</button>
      </div>
    `).join('');

    } catch(e) {
      grid.innerHTML = `<div style="grid-column:1/-1" class="alert a-err">Failed to load projects: ${esc(e.message)}</div>`;
    }
  }

  function startProject(projectId, projectName, dataType) {
    localStorage.setItem('workerProjectId', projectId);
    localStorage.setItem('workerProjectName', projectName);
    localStorage.setItem('workerProjectDataType', (dataType||'TEXT').toUpperCase());
    location.href = `worker-task.html?projectId=${projectId}`;
  }

  // ─── REVIEW ──────────────────────────────────────────────────────────────
  // Бэк НЕ поддерживает фильтр по projectId в /reviews/next
  // Просто переходим на review.html — там кнопка "Load Next"
  function goToReview() {
    location.href = 'review.html';
  }

  loadProjects();
</script>
</body>
</html>
