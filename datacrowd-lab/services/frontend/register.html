<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataCrowd Lab — Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-pg">
  <div class="auth-box">
    <div class="auth-logo">🏷 DataCrowd Lab</div>
    <div class="auth-title">Create account</div>
    <div class="auth-sub">Join as a data labeling worker and start earning points</div>

    <div id="err" class="alert a-err hide"></div>
    <div id="ok" class="alert a-ok hide"></div>

    <div class="fg">
      <label class="lbl">Username</label>
      <input id="uname" type="text" class="inp" placeholder="johndoe">
    </div>
    <div class="fg">
      <label class="lbl">Email</label>
      <input id="email" type="email" class="inp" placeholder="you@example.com">
    </div>
    <div class="fg">
      <label class="lbl">Password</label>
      <input id="pwd" type="password" class="inp" placeholder="Min 8 characters">
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
      <input type="checkbox" id="agree" style="width:15px;height:15px;accent-color:#6366f1" checked>
      <label for="agree" style="font-size:13px;color:#6b7280;">I agree to the <a href="#" class="alink">Terms of Service</a></label>
    </div>

    <button id="btn" class="btn btn-p btn-full" onclick="register()">Create Account</button>

    <hr class="div">
    <div class="auth-foot">Already have account? <a href="index.html" class="alink">Sign in</a></div>
  </div>
</div>
<script>
const API='http://localhost:8080/api';
async function register(){
  const btn=document.getElementById('btn');
  const uname=document.getElementById('uname').value.trim();
  const email=document.getElementById('email').value.trim();
  const pwd=document.getElementById('pwd').value;
  const agreed=document.getElementById('agree').checked;
  document.getElementById('err').classList.add('hide');
  if(!uname||!email||!pwd){showErr('Fill in all fields');return;}
  if(pwd.length<8){showErr('Password must be at least 8 characters');return;}
  if(!agreed){showErr('Please agree to Terms of Service');return;}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating...';
  try{
    const r=await fetch(`${API}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:uname,email,password:pwd})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||'Registration failed');
    localStorage.setItem('token',d.token);
    localStorage.setItem('role',d.role||'WORKER');
    localStorage.setItem('userId',d.userId);
    localStorage.setItem('uname',uname);
    window.location.href='worker.html';
  }catch(ex){showErr(ex.message);btn.disabled=false;btn.textContent='Create Account';}
}
function showErr(m){const el=document.getElementById('err');el.textContent='⚠ '+m;el.classList.remove('hide');}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter')register();});
</script>
</body>
</html>
