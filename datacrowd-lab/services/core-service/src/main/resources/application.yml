server:
  port: ${SERVER_PORT:8082}

spring:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/core_db}
    username: ${SPRING_DATASOURCE_USERNAME:core_user}
    password: ${SPRING_DATASOURCE_PASSWORD:core_pass}
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  data-dir: ${DATA_DIR:/data}
  runner-base-url: ${RUNNER_BASE_URL:http://runner:8090}
  auth-base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  security:
    internal-token: ${INTERNAL_TOKEN:change-me}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    type: ${STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket: ${MINIO_BUCKET:datacrowd-datasets}