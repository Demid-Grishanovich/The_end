services:
  postgres:
    image: postgres:16
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      AUTH_DB: ${AUTH_DB}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}

      CORE_DB: ${CORE_DB}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}

      PAYMENTS_DB: ${PAYMENTS_DB}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - datacrowd_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - datacrowd-net
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datacrowd-net
    env_file:
      - .env

  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ}
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_DB}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datacrowd-net
    env_file:
      - .env

  core-service:
    build:
      context: ../../services/core-service
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ}
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CORE_DB}
      SPRING_DATASOURCE_USERNAME: ${CORE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      RUNNER_BASE_URL: http://runner:8090
    ports:
      - "${CORE_SERVICE_PORT}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datacrowd-net
    env_file:
      - .env
    volumes:
      # storage for uploaded dataset files
      - core_data:/data

  payments-service:
    build:
      context: ../../services/payments-service
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ}
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PAYMENTS_DB}
      SPRING_DATASOURCE_USERNAME: ${PAYMENTS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    ports:
      - "${PAYMENTS_SERVICE_PORT}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datacrowd-net
    env_file:
      - .env

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ}
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      CORE_SERVICE_URL: http://core-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
    ports:
      - "${API_GATEWAY_PORT}:8080"
    depends_on:
      auth-service:
        condition: service_started
      core-service:
        condition: service_started
      payments-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - datacrowd-net
    env_file:
      - .env



  runner:
    build:
      context: ../../services/runner
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ}
      RUNNER_PORT: 8090
      CORE_INTERNAL_URL: http://core-service:8082
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      DATA_DIR: /data
    ports:
      - "${RUNNER_PORT}:8090"
    restart: unless-stopped
    networks:
      - datacrowd-net
    volumes:
      # shared storage with core-service (datasets live here)
      - core_data:/data

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - datacrowd-net
    restart: unless-stopped
    depends_on:
      - core-service
      - auth-service
      - payments-service

  grafana:
      image: grafana/grafana:10.2.0
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
        GF_USERS_ALLOW_SIGN_UP: "false"
      volumes:
        - grafana_data:/var/lib/grafana
        - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      networks:
        - datacrowd-net
      restart: unless-stopped
      depends_on:
        - prometheus

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - datacrowd-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../services/frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - datacrowd-network

networks:
  datacrowd-net:
    driver: bridge
  datacrowd-network:
    driver: bridge

volumes:
  core_data:
  datacrowd_pgdata:
  grafana_data:
  minio_data:

