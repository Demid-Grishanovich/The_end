name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  # ── Auth Service ───────────────────────────────────────────
  auth-service:
    name: Auth Service — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test auth-service
        working-directory: services/auth-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/auth_db
          SPRING_DATASOURCE_USERNAME: auth_user
          SPRING_DATASOURCE_PASSWORD: auth_pass
          JWT_SECRET: ci-test-secret-minimum-32-bytes-long!!
          ADMIN_KEY: ci-admin-key
        run: mvn -B verify --no-transfer-progress

  # ── Core Service ───────────────────────────────────────────
  core-service:
    name: Core Service — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: core_db
          POSTGRES_USER: core_user
          POSTGRES_PASSWORD: core_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_user -d core_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test core-service
        working-directory: services/core-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/core_db
          SPRING_DATASOURCE_USERNAME: core_user
          SPRING_DATASOURCE_PASSWORD: core_pass
          JWT_SECRET: ci-test-secret-minimum-32-bytes-long!!
          INTERNAL_TOKEN: ci-internal-token
          DATA_DIR: /tmp/datacrowd-data
        run: mvn -B verify --no-transfer-progress

  # ── Payments Service ───────────────────────────────────────
  payments-service:
    name: Payments Service — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payments_db
          POSTGRES_USER: payments_user
          POSTGRES_PASSWORD: payments_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments_user -d payments_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test payments-service
        working-directory: services/payments-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payments_db
          SPRING_DATASOURCE_USERNAME: payments_user
          SPRING_DATASOURCE_PASSWORD: payments_pass
          JWT_SECRET: ci-test-secret-minimum-32-bytes-long!!
          INTERNAL_TOKEN: ci-internal-token
          STRIPE_ENABLED: "false"
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
        run: mvn -B verify --no-transfer-progress

  # ── API Gateway ────────────────────────────────────────────
  api-gateway:
    name: API Gateway — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build api-gateway (skip tests — no DB needed)
        working-directory: services/api-gateway
        run: mvn -B package -DskipTests --no-transfer-progress

  # ── Go Runner ──────────────────────────────────────────────
  runner:
    name: Go Runner — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/runner/go.sum

      - name: Build runner
        working-directory: services/runner
        run: go build -v ./...

      - name: Run go vet
        working-directory: services/runner
        run: go vet ./...

  # ── Docker Build Check ─────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [ auth-service, core-service, payments-service, api-gateway, runner ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images (no push)
        run: |
          docker build -t datacrowd/auth-service:ci     services/auth-service
          docker build -t datacrowd/core-service:ci     services/core-service
          docker build -t datacrowd/payments-service:ci services/payments-service
          docker build -t datacrowd/api-gateway:ci      services/api-gateway
          docker build -t datacrowd/runner:ci           services/runner
          docker build -t datacrowd/frontend:ci         services/frontend